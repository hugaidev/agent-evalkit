[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-evalkit"
version = "0.1.0"
description = "Open source eval harness for MCP agents: gold sets, calibrated LLM judges, KPIs and regression gates in CI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Larrauri" }]
keywords = ["evals", "llm", "agents", "mcp", "ci"]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=2.3,<3"]
agent-sdk = [
    "claude-agent-sdk>=0.2.188",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=evalkit --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
